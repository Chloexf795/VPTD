[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vptd-eae"
version = "0.1.0"
description = "Temporal evidence attribution for event argument extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[tool.setuptools.packages.find]
include = ["vptd_eae*"]
